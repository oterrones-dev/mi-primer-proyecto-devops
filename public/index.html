<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oscar DevOps Lab</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      line-height: 1.6;
    }

    header {
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      color: #38bdf8;
    }

    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: bold;
      background: #22c55e;
      color: #0f172a;
    }

    .visit-badge {
      display: inline-block;
      margin: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 40px auto;
    }

    .section-title {
      font-size: 2rem;
      text-align: center;
      color: #facc15;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  <h1>Oscar DevOps Lab 🚀</h1>

  <p>
    Proyecto desplegado con Docker, Git y GitHub Actions
  </p>

  <div class="badge">Pipeline Activo ✅</div>

  <div class="visit-badge">
    Tus visitas: <span id="user-counter">Cargando...</span>
  </div>

  <div class="visit-badge">
    Visitas globales: <span id="total-counter">Cargando...</span>
  </div>

  <div class="visit-badge">
    Tu IP: <span id="user-ip">Detectando...</span>
  </div>

</header>

<main class="container">

  <h2 class="section-title">Tecnologías usadas</h2>

  <div class="cards">
    <div class="card">Linux</div>
    <div class="card">Docker</div>
    <div class="card">Git & GitHub</div>
    <div class="card">CI/CD</div>
  </div>

</main>

<footer>
  Hecho por Oscar Terrones 💻
</footer>

<!-- 🔥 SCRIPT (MISMO ARCHIVO) -->
<script>
  fetch('/api/visits')
    .then(res => res.json())
    .then(data => {
      document.getElementById('user-counter').innerText = data.userVisits;
      document.getElementById('total-counter').innerText = data.totalVisits;
      document.getElementById('user-ip').innerText = data.ip;
    })
    .catch(() => {
      document.getElementById('user-counter').innerText = 'N/D';
      document.getElementById('total-counter').innerText = 'N/D';
      document.getElementById('user-ip').innerText = 'N/D';
    });
</script>

</body>
</html>
